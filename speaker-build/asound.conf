pcm.stereo_to_mono {
    type route
    slave.pcm "hw:1,0"        # Replace with your actual card and device index
    slave.channels 2          # Physical target expectations

    ttable {
        0.0 0.5   # Route Left Input (0) to Left Output (0) at 50% volume
        1.0 0.5   # Route Right Input (1) to Left Output (0) at 50% volume
        0.1 0.5   # Route Left Input (0) to Right Output (1) at 50% volume
        1.1 0.5   # Route Right Input (1) to Right Output (1) at 50% volume
    }
}
